name: Package Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-release-source:
    name: Validate release source
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Require release SHA on main
        shell: bash
        run: |
          git fetch origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release SHA $GITHUB_SHA is not an ancestor of origin/main."
            exit 1
          fi

      - name: Require successful same-SHA CI and release readiness
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          successful_runs="$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f head_sha="$GITHUB_SHA" \
            -f branch=main \
            -f event=push \
            -f status=success \
            --jq '.total_count')"
          if [ "$successful_runs" -lt 1 ]; then
            echo "::error::No successful main push run of ci.yml exists for release SHA $GITHUB_SHA."
            exit 1
          fi
          readiness_runs="$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f head_sha="$GITHUB_SHA" \
            -f branch=main \
            -f event=workflow_dispatch \
            -f status=success \
            --jq '.total_count')"
          if [ "$readiness_runs" -lt 1 ]; then
            echo "::error::No successful manual release-readiness run of ci.yml exists for release SHA $GITHUB_SHA. Dispatch CI on main for this exact commit before packaging."
            exit 1
          fi

      - name: Check release version facts
        run: npm run version:check

      - name: Check document facts
        run: npm run docs:check

      - name: Verify Tauri updater signing secrets
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::Missing TAURI_SIGNING_PRIVATE_KEY. Configure the Tauri updater private key in GitHub Secrets before packaging desktop releases."
            exit 1
          fi
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" ]; then
            echo "::error::Missing TAURI_SIGNING_PRIVATE_KEY_PASSWORD. Configure the Tauri updater private key password in GitHub Secrets before packaging desktop releases."
            exit 1
          fi

  package-macos-arm64:
    name: macOS ARM64 package
    runs-on: macos-15
    timeout-minutes: 45
    needs: validate-release-source

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> ../.iris-dev/target
          shared-key: macos-arm64

      - name: Install dependencies
        run: npm ci

      - name: Restore embedded BGE model
        uses: actions/cache@v5
        with:
          path: .iris-dev/models/bge-small-zh-v1.5
          key: macos-arm64-bge-small-zh-v1.5-fcecc3c5fef6becfa2b2bdda15c1c938857be534

      - name: Package macOS DMG
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/package-local.mjs mac

      - name: Upload macOS DMG and updater bundle
        uses: actions/upload-artifact@v6
        with:
          name: iris-macos-arm64-dmg
          path: |
            .iris-dev/target/release/bundle/dmg/*.dmg
            .iris-dev/target/release/bundle/macos/*.app.tar.gz
            .iris-dev/target/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error
          retention-days: 14

  package-windows-x64:
    name: Windows x64 package
    runs-on: windows-2022
    timeout-minutes: 45
    needs: validate-release-source

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> ../.iris-dev/target
          shared-key: windows-x64

      - name: Install dependencies
        run: npm ci

      - name: Restore embedded BGE model
        uses: actions/cache@v5
        with:
          path: .iris-dev/models/bge-small-zh-v1.5
          key: windows-x64-bge-small-zh-v1.5-fcecc3c5fef6becfa2b2bdda15c1c938857be534

      - name: Package Windows NSIS installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run package:local:win

      - name: Upload Windows installer and updater signature
        uses: actions/upload-artifact@v6
        with:
          name: iris-windows-x64-nsis
          path: |
            .iris-dev/target/release/bundle/nsis/*setup.exe
            .iris-dev/target/release/bundle/nsis/*setup.exe.sig
          if-no-files-found: error
          retention-days: 14

  draft-release:
    name: Draft GitHub Release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs:
      - package-macos-arm64
      - package-windows-x64
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Download Windows installer artifact
        uses: actions/download-artifact@v7
        with:
          name: iris-windows-x64-nsis
          path: release-assets/windows

      - name: Download macOS DMG artifact
        uses: actions/download-artifact@v7
        with:
          name: iris-macos-arm64-dmg
          path: release-assets/macos

      - name: Build Tauri updater latest.json
        shell: bash
        run: |
          node scripts/build-updater-manifest.mjs \
            --version "$GITHUB_REF_NAME" \
            --asset-base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}" \
            --assets-dir release-assets \
            --out release-assets/latest.json

      - name: Verify updater release assets
        shell: bash
        run: |
          node scripts/verify-updater-release.mjs \
            --version "$GITHUB_REF_NAME" \
            --asset-base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}" \
            --assets-dir release-assets \
            --manifest release-assets/latest.json

      - name: Create or update draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s globstar nullglob
          assets=(
            release-assets/windows/**/*setup.exe
            release-assets/windows/**/*setup.exe.sig
            release-assets/macos/**/*.dmg
            release-assets/macos/**/*.app.tar.gz
            release-assets/macos/**/*.app.tar.gz.sig
            release-assets/latest.json
          )

          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            is_draft="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
            if [ "$is_draft" != "true" ]; then
              echo "::error::Release $GITHUB_REF_NAME already exists and is not a draft. Refusing to modify a published release."
              exit 1
            fi

            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --draft --generate-notes --verify-tag
          fi
