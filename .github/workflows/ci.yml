name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend-quality:
    name: Frontend quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check version facts
        run: npm run version:check

      - name: Check document facts
        run: npm run docs:check

      - name: Check formatting
        run: npm run format:check

      - name: Lint frontend
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run frontend tests
        run: npm run test

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

  rust-quality-macos-arm64:
    name: Rust quality / macOS ARM64
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> ../.iris-dev/target
          shared-key: macos-arm64

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Lint Rust
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Run deterministic sqlite-vec migration and KNN checks
        if: github.event_name == 'pull_request'
        working-directory: src-tauri
        run: |
          cargo test --features sqlite-vec sqlite_vec_v3_mirrors_all_canonical_caches_insert_update_and_delete
          cargo test --features sqlite-vec semantic_search_uses_sqlite_vec_knn_and_never_skips_a_large_index

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit Rust dependencies
        run: npm run audit:rust

  agent-smoke:
    name: Agent 24-case smoke
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> ../.iris-dev/target
          shared-key: macos-agent-smoke

      - name: Run Agent 24-case smoke gate
        run: npm run agent:eval:smoke

  release-readiness-macos-arm64:
    name: Release readiness / macOS ARM64
    # Keep the ordinary main/PR gate deterministic and bounded. The expensive
    # model-provisioned RAG and desktop-release checks remain available as an
    # explicit pre-release dispatch. Desktop packaging requires both the
    # successful same-SHA main push run and this successful manual run.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> ../.iris-dev/target
          shared-key: macos-arm64

      - name: Run Agent full baseline gate
        run: npm run agent:eval

      - name: Restore embedded BGE model
        uses: actions/cache@v5
        with:
          path: .iris-dev/models/bge-small-zh-v1.5
          key: macos-arm64-bge-small-zh-v1.5-fcecc3c5fef6becfa2b2bdda15c1c938857be534
          restore-keys: |
            macos-arm64-bge-small-zh-v1.5-

      - name: Verify or prepare embedded BGE model
        run: npm run model:prepare

      - name: Run provisioned sqlite-vec RAG gate
        run: cargo test --manifest-path src-tauri/Cargo.toml --features sqlite-vec --test rag_broker_eval rag_v2_provisioned_sqlite_vec_model_meets_release_quality_gates -- --ignored --nocapture

      - name: Run 50k sqlite-vec performance gate
        env:
          IRIS_RAG_PERFORMANCE_REFERENCE: github-hosted-macos-15-arm64
        run: cargo test --manifest-path src-tauri/Cargo.toml --features sqlite-vec --test rag_broker_eval sqlite_vec_50k_scale_fixture_meets_warm_knn_release_gate -- --ignored --nocapture

  windows-desktop-e2e:
    name: Windows x64 desktop E2E
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> ../.iris-dev/target
          shared-key: windows-x64

      - name: Install dependencies
        run: npm ci

      - name: Build Windows debug desktop executable
        run: npm run tauri -- build --debug --no-bundle

      - name: Cache Tauri WebDriver tools
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}\iris-webdriver-tools
          key: windows-webdriver-tools-2.0.6

      - name: Install pinned Tauri WebDriver tools
        shell: pwsh
        env:
          IRIS_WEBDRIVER_TOOLS: ${{ runner.temp }}\iris-webdriver-tools
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path "$env:IRIS_WEBDRIVER_TOOLS/bin/tauri-driver.exe")) {
            cargo install tauri-driver --version 2.0.6 --locked --root "$env:IRIS_WEBDRIVER_TOOLS"
          }
          if (-not (Test-Path "$env:IRIS_WEBDRIVER_TOOLS/bin/msedgedriver-tool.exe")) {
            cargo install --git https://github.com/chippers/msedgedriver-tool --rev 8c4b34f51b45f5cf08013366d703de464ab871d1 --root "$env:IRIS_WEBDRIVER_TOOLS"
          }
          & "$env:IRIS_WEBDRIVER_TOOLS/bin/msedgedriver-tool.exe"
          if (-not (Test-Path "$PWD/msedgedriver.exe")) {
            throw "msedgedriver-tool did not produce msedgedriver.exe"
          }
          "$env:IRIS_WEBDRIVER_TOOLS/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $PWD.Path | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Run Windows Markdown persistence desktop E2E
        shell: pwsh
        env:
          IRIS_DESKTOP_E2E_APP: ${{ github.workspace }}\.iris-dev\target\debug\iris.exe
        run: npm run test:desktop:windows
