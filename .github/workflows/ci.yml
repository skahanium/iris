name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality-macos-arm64:
    name: macOS ARM64 quality
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> ../.iris-dev/target
          shared-key: macos-arm64

      - name: Install dependencies
        run: npm ci

      - name: Check version facts
        run: npm run version:check

      - name: Check document facts
        run: npm run docs:check

      - name: Check formatting
        run: npm run format:check

      - name: Lint frontend
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run frontend tests
        run: npm run test

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Lint Rust
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Run Agent 24-case smoke gate
        run: npm run agent:eval:smoke

      - name: Audit npm dependencies
        run: npm audit

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit Rust dependencies
        run: npm run audit:rust

  windows-desktop-e2e:
    name: Windows x64 desktop E2E
    if: github.event_name != 'pull_request'
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> ../.iris-dev/target
          shared-key: windows-x64

      - name: Install dependencies
        run: npm ci

      - name: Build Windows debug desktop executable
        run: npm run tauri -- build --debug --no-bundle

      - name: Install pinned Tauri WebDriver tools
        shell: pwsh
        env:
          IRIS_WEBDRIVER_TOOLS: ${{ runner.temp }}\iris-webdriver-tools
        run: |
          $ErrorActionPreference = "Stop"
          cargo install tauri-driver --version 2.0.6 --locked --root "$env:IRIS_WEBDRIVER_TOOLS"
          cargo install --git https://github.com/chippers/msedgedriver-tool --rev 8c4b34f51b45f5cf08013366d703de464ab871d1 --root "$env:IRIS_WEBDRIVER_TOOLS"
          & "$env:IRIS_WEBDRIVER_TOOLS/bin/msedgedriver-tool.exe"
          if (-not (Test-Path "$PWD/msedgedriver.exe")) {
            throw "msedgedriver-tool did not produce msedgedriver.exe"
          }
          "$env:IRIS_WEBDRIVER_TOOLS/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $PWD.Path | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Run Windows Markdown persistence desktop E2E
        shell: pwsh
        env:
          IRIS_DESKTOP_E2E_APP: ${{ github.workspace }}\.iris-dev\target\debug\iris.exe
        run: npm run test:desktop:windows
