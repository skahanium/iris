name: sqlite-vec Scale Ladder

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sqlite-vec-scale-ladder-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sqlite-vec-scale-ladder:
    name: sqlite-vec 1k/10k/25k/50k KNN ladder
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Run sqlite-vec KNN scale ladder
        working-directory: src-tauri
        env:
          IRIS_RAG_PERFORMANCE_REFERENCE: github-hosted-ubuntu-24.04-x64
        run: cargo test --features sqlite-vec --test rag_broker_eval sqlite_vec_50k_scale_fixture_meets_warm_knn_release_gate -- --ignored --nocapture
