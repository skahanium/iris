version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    groups:
      development-tooling:
        dependency-type: development
        patterns: ["*"]
      production-dependencies:
        dependency-type: production
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: "/src-tauri"
    schedule:
      interval: monthly
    groups:
      rust-dependencies:
        patterns: ["*"]
