[package]
name = "iris"
version = "1.2.21"
description = "Local-first AI-native Markdown notes"
authors = ["Iris Contributors"]
license = "AGPL-3.0"
edition = "2021"
rust-version = "1.85"

[lib]
name = "iris_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.33", features = ["bundled"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
minisign-verify = "0.2.5"
aes-gcm = "0.10"
rand = "0.8"
argon2 = "0.5"
zeroize = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
notify = "8"
notify-debouncer-full = "0.6"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream", "system-proxy", "socks"] }
rmcp = { version = "2.2.0", default-features = false, features = ["client", "reqwest", "transport-async-rw", "transport-child-process", "transport-streamable-http-client-reqwest"] }
http = "1"
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
futures-util = "0.3"
# Required by the bounded Streamable HTTP adapter below. This exact version is
# already resolved transitively by rmcp; MIT OR Apache-2.0 is AGPL-compatible.
sse-stream = "0.2.4"
uuid = { version = "1", features = ["v4"] }
regex = "1"
walkdir = "2"
fastembed = { version = "5", default-features = false, features = ["ort-download-binaries-rustls-tls", "hf-hub-rustls-tls"] }
scraper = "0.27"
# RSS/Atom/JSON Feed 解析（MIT）：避免自写多格式解析器；sanitize feature 在解析
# 时清理 HTML 字段。精确版本锁定，避免预 1.0 转换行为漂移。
feed-rs = { version = "=2.4.0", features = ["sanitize"] }
# HTML → Markdown（Apache-2.0）：避免自写 HTML 转换器。精确版本锁定，
# 预 1.0 行为可能变化；不再引入第三个 sanitizer crate（复用 feed-rs 与前端 DOMPurify）。
htmd = "=0.5.5"
toml = "0.8"
# sqlite-vec is the default bounded semantic-search backend on desktop. Keep the
# stable version exact because its pre-1.0 FFI and vec0 behavior may change.
sqlite-vec = { version = "=0.1.9", default-features = false, optional = true }

[features]
default = ["sqlite-vec"]
sqlite-vec = ["dep:sqlite-vec"]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }
windows-registry = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
system-configuration = "0.7"

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }
tauri = { version = "2", features = ["test"] }

[[bench]]
name = "ai_benchmarks"
harness = false

[[test]]
name = "classified_vault"
path = "tests/classified_vault.rs"

[[test]]
name = "file_ops"
path = "tests/file_ops.rs"

[[test]]
name = "frontmatter_index"
path = "tests/frontmatter_index.rs"

[[test]]
name = "vault_watcher"
path = "tests/vault_watcher.rs"

[[test]]
name = "cas_hash"
path = "tests/cas/hash_test.rs"

[[test]]
name = "cas_store"
path = "tests/cas/store_test.rs"

[[test]]
name = "cas_ref_counter"
path = "tests/cas/ref_counter_test.rs"

[[test]]
name = "cas_garbage_collector"
path = "tests/cas/garbage_collector_test.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
